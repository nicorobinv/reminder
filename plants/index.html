<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://api.github.com https://api.open-meteo.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F6F1">
<title>플랜츠</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 58V30' stroke='%232F6B45' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 34C16 34 10 22 10 10c14 0 22 8 22 24zM32 30c0-14 8-22 22-22 0 14-8 22-22 22z' fill='%234F8A62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F1;--card:#FFFFFF;--line:#E1E6DC;--line2:#EEF1EB;--ink:#1E2A22;--ink2:#3E4C43;--mute:#56655B;--green:#2F6B45;--green-d:#1F4D31;--green-bg:#E3EFE6;--green-t:#24553A;--soft:#EEF3EA;--amber-bg:#FBEFD5;--amber-t:#8A5300;--rust-bg:#FBE4DA;--rust-t:#9A3412;--blue-bg:#E2EDF7;--blue-t:#1D4F7A;--field:#FBFCFA;--fline:#CFD6CA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--green)}a:hover{color:var(--green-d)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{margin:0;font-size:17px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.muted{color:var(--mute)}.small{font-size:12px}.s13{font-size:13px}
.f1{flex:1 1 320px}.f2{flex:2 1 420px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
header.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:13px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.chip.green{color:var(--green-t);background:var(--green-bg);border-color:transparent;font-weight:500}
.chip.soft{color:#2F5A3E;background:var(--soft);border-color:transparent}
.chip.warn{color:var(--rust-t);background:var(--rust-bg);border-color:transparent;font-weight:700}
button.chip{cursor:pointer;min-height:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;border-radius:10px;padding:9px 16px;min-height:44px;cursor:pointer;border:1px solid var(--fline);background:#fff;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#9FB0A4;color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--green-d);color:#fff}
.btn.danger{color:var(--rust-t);border-color:#E7B9A6}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--green);cursor:pointer;padding:8px 0;min-height:40px;font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.fields{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 100px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:500;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{padding:10px 12px;min-height:44px;border:1px solid var(--fline);border-radius:10px;background:var(--field);width:100%}
.field input.big{font-size:18px;font-weight:700}
.field textarea{min-height:160px;line-height:1.6;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--green);margin:0;flex:none}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:20px}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.alerts li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55}
.tag{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.tag.ok{color:var(--green-t);background:var(--green-bg)}
.tag.info{color:var(--blue-t);background:var(--blue-bg)}
.tag.caution{color:var(--amber-t);background:var(--amber-bg)}
.tag.danger{color:var(--rust-t);background:var(--rust-bg)}
.task{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.task .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.task .t b{font-size:15px}
.task.done .t b{color:var(--mute);text-decoration:line-through}
.donemark{font-size:13px;font-weight:700;color:var(--green-t);background:var(--green-bg);padding:8px 12px;border-radius:999px}
.spot-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.spot-head h3{margin:0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard:hover{border-color:#9FB0A4;color:var(--ink)}
.pcard .nm{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .nm b{font-size:16px}
.badge{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.rule{align-self:flex-start;font-size:12px;color:#2F5A3E;background:var(--soft);border-radius:6px;padding:4px 8px}
.gauge{height:8px;background:#E8ECE4;border-radius:999px;overflow:hidden}
.gauge>i{display:block;height:100%;border-radius:999px}
.kv{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.mini{font-size:11px;font-weight:700;color:var(--blue-t);background:var(--blue-bg);padding:2px 6px;border-radius:6px}
.banner{background:#fff;border:1px dashed #B7C4BA;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-size:13px;line-height:1.6}
.reason{background:#F7F9F5;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.reason ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink2)}
.big{font-size:40px;font-weight:700;line-height:1.1}
.scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:12px;border-radius:999px;overflow:hidden}
.scale-l{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));font-size:12px;color:var(--ink2)}
dl.info{margin:0;display:grid;grid-template-columns:96px 1fr;row-gap:10px;column-gap:12px;font-size:14px}
dl.info dt{color:var(--mute)}dl.info dd{margin:0}
.unset{color:var(--amber-t)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line2);align-items:start;font-size:13px;line-height:1.6}
.hist .d{font-weight:700;color:var(--ink2)}
.x{background:none;border:none;color:var(--mute);cursor:pointer;min-width:36px;min-height:36px;border-radius:8px;font-size:16px}
.x:hover{background:var(--bg);color:var(--rust-t)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-size:14px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
.tab[aria-selected=true]{font-weight:700;color:#fff;background:var(--green);border-color:var(--green)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:14px;line-height:1.6}
th,td{padding:12px 14px;text-align:left;vertical-align:top}
thead tr{background:#F7F9F5}
tbody tr{border-top:1px solid var(--line2)}
tr.now{background:#F3F8F3}tr.now th{color:var(--green-t)}
.paras p{margin:0 0 8px;font-size:14px;line-height:1.75}
.trouble{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trouble li{display:grid;grid-template-columns:minmax(140px,1fr) 2fr;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px;line-height:1.6}
.trouble li b{font-weight:700}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
.note.danger{background:var(--rust-bg)}.note.caution{background:var(--amber-bg)}.note.info{background:var(--blue-bg)}.note.good{background:var(--green-bg)}.note.warn{background:var(--amber-bg)}
.note b{display:block;font-size:15px;margin-bottom:2px}
.note code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:rgba(255,255,255,.6);padding:1px 5px;border-radius:5px}
.note.danger b{color:var(--rust-t)}.note.caution b,.note.warn b{color:var(--amber-t)}.note.info b{color:var(--blue-t)}.note.good b{color:var(--green-t)}
footer.foot{font-size:12px;color:var(--mute);line-height:1.7;text-align:center;padding-top:8px}
/* 오버레이 */
#overlay:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(20,30,24,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;border-radius:16px 16px 0 0;overflow:hidden}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:16px}
.sheet-b{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.sheet-f{flex:none;padding:12px 16px 18px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-radius:12px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--fline);background:#fff}
.opt[aria-pressed=true]{border:2px solid var(--green);background:#EEF5EF}
.opt .dot{flex:none;width:20px;height:20px;border-radius:999px;border:2px solid #9AA79E;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed=true] .dot{border-color:var(--green)}
.opt[aria-pressed=true] .dot::after{content:'';width:10px;height:10px;border-radius:999px;background:var(--green)}
.opt .ol{display:flex;flex-direction:column;gap:1px}.opt .ol b{font-size:15px}
.pill{font-size:14px;padding:8px 14px;min-height:44px;border-radius:999px;cursor:pointer;border:1px solid var(--fline);background:#fff}
.pill[aria-pressed=true]{border-color:var(--green);background:var(--green);color:#fff;font-weight:700}
.step{display:flex;flex-direction:column;gap:10px}
.step h3{margin:0;font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast:empty{display:none}
.spotlist{list-style:none;margin:0;padding:0}
.spotlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
@media (min-width:700px){.ov{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:92vh}}
@media (max-width:520px){.wrap{padding:16px 14px 56px;gap:18px}header.top h1{font-size:22px}.big{font-size:34px}.trouble li{grid-template-columns:1fr;gap:2px}}

</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="muted">불러오는 중…</p></div></div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div class="wrap"><p>이 페이지는 JavaScript가 필요해요.</p></div></noscript>
<script>
/* 우리 방 식물 — 물 주기 관리 페이지 (한 파일 구성) */
/* ===== 식물 종 정보 =====
 * threshold(ctx): 남은 수분(%)이 이 값 이하가 되면 "흙 확인" 알림
 * baseLoss: 기준 환경(22℃·습도 50%·여름 계수 1)에서 하루에 줄어드는 수분(%)
 * topVerdict(ctx): "겉만 말랐어요"일 때 판정
 * info: 기르는 법 기본 문구 (화면에서 수정 가능)
 */
var SPECIES = {
  wilma: {
    name: '윌마',
    full: '골드크레스트 윌마',
    latin: "Cupressus macrocarpa 'Wilma'",
    baseLoss: 18,
    moistWait: 2,
    cold: null,
    threshold: function () { return 40; },
    rule: function () { return '겉흙이 마르면 흠뻑'; },
    topVerdict: function () { return { action: 'water' }; },
    info: {
      feature: '골드크레스트의 왜성 품종으로, 레몬 향이 나는 밝은 황록색 잎이 1년 내내 유지돼요.\n해를 좋아하고 배수가 잘 되는 흙을 좋아해요.\n코니퍼 중에서는 추위에 약한 편이에요.',
      water: '1년 내내 겉흙이 마르면 화분 밑으로 흘러나올 만큼 흠뻑 줘요.\n과습(뿌리 썩음)과 물부족 둘 다에 약해요. 날짜가 아니라 흙을 보고 주세요.\n겨울에 난방하는 실내는 생각보다 화분이 빨리 말라요.\n받침에 고인 물은 바로 버려요.',
      light: '해가 잘 드는 곳이 좋아요. 빛이 극단적으로 부족하면 포기가 연약해져요.\n에어컨·히터 바람, 실외기 바람이 직접 닿는 곳은 피하세요.\n잎이 빽빽해 통풍이 안 되면 안쪽부터 갈색으로 변해요.',
      temp: '장마~여름의 고온다습과 통풍 불량(무레, 蒸れ)에 약해요. 욕실 근처처럼 습기가 모이는 곳은 피하세요.\n실외: 최저기온 0℃ 이하가 이어지거나 흙이 얼 정도면 실내로 들여요.\n실내에선 가끔 엽수(잎에 분무)도 좋아요.',
      seasons: '봄 | 겉흙이 마르면 흠뻑 | 해가 잘 드는 곳 | —\n장마~여름 | 겉흙이 마르면 흠뻑 | 통풍 확보, 무레 주의 | 습기가 모이는 곳 피하기\n가을 | 겉흙이 마르면 흠뻑 | 해가 잘 드는 곳 | —\n겨울 | 마른 정도를 확인하며 흠뻑 | 실외는 0℃ 이하가 이어지면 실내로 | 난방 실내는 빨리 마름, 가끔 엽수',
      trouble: '안쪽(줄기 쪽)부터 갈색 → 고온다습·통풍 불량(무레). 통풍을 확보하고 습기 많은 곳에서 옮기기\n잎끝이 바삭바삭 → 물부족·건조. 잎이 노란색이라 변화가 잘 안 보이니 잎끝을 만져 확인\n흙이 젖어 있는데 시듦 → 뿌리 썩음 의심. 물을 멈추고 환기·자리 점검\n화분 밑으로 뿌리가 나옴 → 뿌리가 꽉 참. 뿌리 덩어리는 풀지 말고 한 치수 큰 화분으로',
      safety: '확인된 자료가 없어요. 아이·반려동물이 먹지 않게 두는 게 안전해요.'
    }
  },

  coffee: {
    name: '커피나무',
    full: '커피나무 (아라비카)',
    latin: 'Coffea arabica',
    baseLoss: 15,
    moistWait: 2,
    cold: { caution: 10, danger: 5 },
    nightBlind: true,
    threshold: function (ctx) {
      if (ctx.coffeeWinter) return 18;
      if (ctx.season === 'autumn') return 32;
      return 40;
    },
    rule: function (ctx) {
      if (ctx.coffeeWinter) return '겨울: 흙 속까지 완전히 마른 뒤';
      if (ctx.season === 'autumn') return '가을: 겉흙 마르고 1~2일 뒤';
      return '겉흙이 마르면 흠뻑';
    },
    topVerdict: function (ctx) {
      if (ctx.coffeeWinter) return { action: 'wait', days: 3, why: '겨울(15℃ 미만)엔 흙 속까지 완전히 마른 뒤에 줘요. 3일 뒤 다시 확인할게요.' };
      if (ctx.season === 'autumn') return { action: 'wait', days: 1, why: '가을엔 겉흙이 마르고 1~2일 뒤에 줘요. 내일 다시 확인할게요.' };
      return { action: 'water' };
    },
    info: {
      feature: '에티오피아 고원 원산의 상록수로, 광택 있는 짙은 녹색 잎이 특징이에요. 관엽식물로는 주로 아라비카종이 유통돼요.\n햇빛, 10℃ 이상, 배수가 잘 되는 흙 — 이 세 가지가 조건이에요.',
      water: '봄~여름: 겉흙이 마르면 화분 밑으로 흘러나올 만큼 흠뻑.\n가을: 겉흙이 마르고 1~2일 뒤, 횟수를 서서히 줄이기.\n겨울: 15℃ 아래로 내려갈 무렵부터 줄이고, 흙 속까지 완전히 마른 뒤에.\n받침에 고인 물은 바로 버려요. 물은 따뜻한 날 아침에 주는 게 좋아요.',

}

function weekday(s) { return WEEK[new Date(parseDay(s)).getUTCDay()]; }

function fetchWeather(lat, lon, prev) {

function b64EncodeUtf8(str) {

var GH = {

/* ===== 동작 ===== */
function onAct(act, el) {
  var today = todayStr();
  if (act === 'close') return closeOverlay();
  if (act === 'banner-off') { UI.bannerOff = true; saveUI(); return render(); }
  if (act === 'focus-reading') {
    var inp = document.getElementById('r-temp');
    if (inp) { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); inp.focus(); }
    return;
  }
  if (act === 'retry-weather') return loadWeather(true);
  if (act === 'water') {
    var id = el.getAttribute('data-id');
    return commit(function (d) { var l = newLog({ plantId: id, type: 'water' }); d.logs[l.id] = l; }, '물 준 것을 기록했어요');
  }
  if (act === 'del-log') {
    var lid = el.getAttribute('data-id');
    if (!confirm('이 기록을 삭제할까요?')) return;
    return commit(function (d) { var l = d.logs[lid]; if (l) { l.deleted = true; l.updatedAt = Date.now(); } }, '기록을 삭제했어요');
  }
  if (act === 'tab') {
    UI.infoTab = UI.infoTab || {};
    UI.infoTab[el.getAttribute('data-sp')] = el.getAttribute('data-key');
    saveUI();
    return render();
  }
  if (act === 'res') { CHECK.result = el.getAttribute('data-v'); return render(); }
  if (act === 'leaf') { CHECK.leaf = el.getAttribute('data-v'); return render(); }
  if (act === 'mode') { CHECK.mode = CHECK.mode === 'sustee' ? 'finger' : 'sustee'; CHECK.result = null; return render(); }
  if (act === 'save-check') return saveCheck(today);
  if (act === 'sync-now') return syncNow();
  if (act === 'gh-clear') {
    if (!confirm('이 기기에서 따로 넣은 GitHub 토큰을 지울까요? 데이터는 남아 있어요. (리마인더 연결이 있으면 그걸 함께 써요)')) return;
    var c = Store.get(LS.gh) || {}; Store.set(LS.gh, { path: c.path, branch: c.branch });
    SYNC.state = 'off'; render(); return toast('토큰을 지웠어요');
  }
  if (act === 'export') return exportData(today);
  if (act === 'import') { var f = document.getElementById('import-file'); if (f) f.click(); return; }
  if (act === 'reset') {
    if (!confirm('이 기기의 식물 데이터를 모두 지울까요?')) return;
    if (!confirm('정말 지울까요? 동기화를 쓰지 않았다면 되돌릴 수 없어요.')) return;
    Store.del(LS.data); Store.del(LS.wx); location.hash = '#/'; location.reload(); return;
  }
  if (act === 'del-plant') {
    var pid = el.getAttribute('data-id');
    if (!confirm('이 식물을 삭제할까요? 기록은 백업에 남아요.')) return;
    overlayPushed = false;
    DATA.plants[pid].deleted = true; DATA.plants[pid].updatedAt = Date.now();
    Store.set(LS.data, DATA); scheduleSync();
    replaceHash('#/');
    return toast('삭제했어요');
  }
  if (act === 'del-spot') {
    var sid = el.getAttribute('data-id');
    var n = live(DATA.plants).filter(function (p) { return p.spotId === sid; }).length;
    if (n) return alert('이 자리에 식물이 ' + n + '그루 있어요. 먼저 다른 자리로 옮겨주세요.');
    if (!confirm('이 자리를 삭제할까요?')) return;
    commit(function (d) { var s = d.spots[sid]; if (s) { s.deleted = true; s.updatedAt = Date.now(); } }, '자리를 삭제했어요');
    return closeOverlay();
  }
  if (act === 'info-reset') {
    var key = el.getAttribute('data-sp') + '.' + el.getAttribute('data-key');
    commit(function (d) { d.info[key] = { text: null, deleted: true, updatedAt: Date.now() }; }, '기본 문구로 되돌렸어요');
    return closeOverlay();
  }
}
function saveCheck(today) {
  var p = DATA.plants[CHECK.plantId];
  if (!p || !CHECK.result) return;
  var all = computeAll(DATA, WEATHER, today);
  var st = all.states[p.id];
  var v = verdictFor(p, CHECK.result, CHECK.leaf, st, all.env, today, { sustee: CHECK.mode === 'sustee' });
  var checks = {};
  if (v.action === 'water') afterChecks(p).forEach(function (c) { checks[c.key] = !!CHECK.checks[c.key]; });
  var log = newLog({ plantId: p.id, type: 'check', result: CHECK.result, leaf: CHECK.leaf, action: v.action, waitDays: v.action === 'wait' ? v.waitDays : null, sustee: CHECK.mode === 'sustee', checks: checks, note: (CHECK.note || '').trim() });
  CHECK = null;
  DATA.logs[log.id] = log;
  Store.set(LS.data, DATA);
  scheduleSync();
  var st2 = simulate(p, DATA, buildEnv(DATA, WEATHER), today);
  closeOverlay();
  toast((v.action === 'water' ? '물 준 것까지 기록했어요' : '기록했어요') + ' · 다음 확인 ' + relDay(st2.next, today));
}
function onSubmit(form) {
  var kind = form.getAttribute('data-form');
  var fd = new FormData(form);
  var now = Date.now();
  var today = todayStr();
  if (kind === 'reading') {
    var date = (document.getElementById('read-date') || {}).value || today;
    if (date > today) date = today;
    var temp = parseFloat(fd.get('temp')), hum = parseFloat(fd.get('hum')), tminRaw = fd.get('tmin');
    var tmin = tminRaw === '' || tminRaw == null ? null : parseFloat(tminRaw);
    if (!isFinite(temp) || temp < -15 || temp > 50) return toast('온도를 확인해 주세요 (-15~50℃)');
    if (!isFinite(hum) || hum < 1 || hum > 100) return toast('습도를 확인해 주세요 (1~100%)');
    if (tmin != null && (!isFinite(tmin) || tmin < -20 || tmin > 50)) return toast('밤 최저 온도를 확인해 주세요');
    if (document.activeElement) document.activeElement.blur();
    READ_DATE = date === today ? null : date;
    return commit(function (d) { d.readings[date] = { date: date, temp: temp, hum: Math.round(hum), tmin: tmin, updatedAt: now }; }, '온습도를 저장했어요');
  }
  if (kind === 'plant') {
    var id = form.getAttribute('data-id');
    var name = String(fd.get('name') || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    var size = fd.get('potSize');
    var o = {
      name: name, species: fd.get('species'), spotId: fd.get('spotId'),
      potSize: size === '' || size == null ? null : parseFloat(size),
      potMaterial: fd.get('potMaterial') || null, base: fd.get('base') || null,
      sustee: fd.get('sustee') === 'on', updatedAt: now
    };
    if (id === 'new') {
      var nid = uid('p');
      var maxOrder = live(DATA.plants).reduce(function (m, p) { return Math.max(m, p.order || 0); }, 0);
      o.id = nid; o.created = today; o.startMoisture = parseFloat(fd.get('startMoisture')) || 60; o.order = maxOrder + 1;
      DATA.plants[nid] = o;
      Store.set(LS.data, DATA); scheduleSync();
      overlayPushed = false;
      DIRTY = {};
      replaceHash('#/plant/' + encodeURIComponent(nid));
      return toast('식물을 추가했어요');
    }
    commit(function (d) { var p = d.plants[id]; for (var k in o) p[k] = o[k]; }, '저장했어요');
    return closeOverlay();
  }
  if (kind === 'spot') {
    var sid = form.getAttribute('data-id');
    var sname = String(fd.get('name') || '').trim();
    if (!sname) return toast('이름을 입력해 주세요');
    var so = { name: sname, outdoor: fd.get('outdoor') === 'on', sun: fd.get('sun'), vent: fd.get('vent'), rain: fd.get('rain') === 'on', moistSource: fd.get('moistSource') === 'on', summerShade: fd.get('summerShade') === 'on', updatedAt: now };
    commit(function (d) {
      if (sid === 'new') {
        var ns = uid('s');
        so.id = ns; so.order = live(d.spots).reduce(function (m, s) { return Math.max(m, s.order || 0); }, 0) + 1;
        d.spots[ns] = so;
      } else { var s = d.spots[sid]; for (var k in so) s[k] = so[k]; }
    }, '자리를 저장했어요');
    return closeOverlay();
  }
  if (kind === 'info') {
    var key = form.getAttribute('data-sp') + '.' + form.getAttribute('data-key');
    var text = String(fd.get('text') || '');
    commit(function (d) { d.info[key] = { text: text, updatedAt: now }; }, '기르는 법을 저장했어요');
    return closeOverlay();
  }
  if (kind === 'gh') {
    var prev = Store.get(LS.gh) || {};
    var tok = String(fd.get('token') || '').trim() || prev.token || '';
    var cfg = {
      owner: String(fd.get('owner') || '').trim(), repo: String(fd.get('repo') || '').trim().replace(/\.git$/, ''),
      branch: String(fd.get('branch') || '').trim(), path: String(fd.get('path') || '').trim().replace(/^\/+/, '') || 'plantcare/data.json',
      token: tok, verified: false
    };
    if (!cfg.token) {
      // 토큰 없이 저장 = 리마인더 연결을 함께 씀 (경로·브랜치만 반영)
      Store.set(LS.gh, { path: cfg.path, branch: cfg.branch });
      render(); toast('저장했어요');
      return syncNow();
    }
    if (!cfg.owner || !cfg.repo) return toast('사용자명과 저장소 이름을 입력해 주세요');
    Store.set(LS.gh, cfg);
    SYNC.state = 'syncing'; updateSyncChip();
    return GH.repoInfo(cfg).then(function (info) {
      if (!info || info.private !== true) {
        SYNC.state = 'error'; SYNC.msg = '공개(Public) 저장소예요. 기록이 누구에게나 보이니 비공개 저장소를 써 주세요';
        updateSyncChip(); return toast('비공개 저장소만 연결할 수 있어요');
      }
      cfg.verified = true; Store.set(LS.gh, cfg);
      render(); toast('동기화 설정을 저장했어요');
      return syncNow();
    }).catch(function (e) {
      SYNC.state = 'error'; SYNC.msg = e && e.status ? e.message : '오프라인이거나 GitHub에 연결할 수 없어요';
      updateSyncChip();
    });
  }
  if (kind === 'link') {
    var u = String(fd.get('reminderUrl') || '').trim() || '../';
    if (/^(javascript|data|vbscript):/i.test(u)) return toast('주소를 확인해 주세요');
    return commit(function (d) { d.settings = Object.assign({}, d.settings, { reminderUrl: u, updatedAt: now }); }, '링크를 저장했어요');
  }
  if (kind === 'loc') {
    var lat = parseFloat(fd.get('lat')), lon = parseFloat(fd.get('lon'));
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return toast('위도·경도를 확인해 주세요');
    commit(function (d) {
      d.settings = Object.assign({}, d.settings, { lat: lat, lon: lon, placeName: String(fd.get('placeName') || '').trim(), thermoSpotId: fd.get('thermoSpotId') || d.settings.thermoSpotId, updatedAt: now });
    }, '저장했어요');
    return loadWeather(true);
  }
}
function exportData(today) {
  var blob = new Blob([JSON.stringify(DATA, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plantcare-backup-' + today + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}
function importFile(file) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = normalizeData(JSON.parse(rd.result));
      if (!d.plants || typeof d.plants !== 'object') throw new Error('형식');
      commit(function () { DATA = mergeData(DATA, d); }, '가져와서 합쳤어요');
    } catch (e) { toast('파일을 읽지 못했어요 — 이 페이지에서 내보낸 JSON인지 확인해 주세요'); }
  };
  rd.readAsText(file);
}

/* ===== 동기화 ===== */
function scheduleSync() {
  if (!GH.configured(GH.cfg())) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(syncNow, 1500);
}
function syncNow() {
  var c = GH.cfg();
  if (!GH.configured(c)) { SYNC.state = 'off'; updateSyncChip(); return Promise.resolve(); }
  if (SYNC.running) { SYNC.pending = true; return Promise.resolve(); }
  SYNC.running = true; SYNC.state = 'syncing'; updateSyncChip();
  var attempt = 0;
  function once() {
    return GH.get(c).then(function (remote) {
      var rdata = remote.exists ? normalizeData(remote.data) : null;
      var merged = rdata ? mergeData(DATA, rdata) : DATA;
      if (stableString(merged) !== stableString(DATA)) { DATA = merged; Store.set(LS.data, DATA); requestRender(); }
      if (rdata && stableString(merged) === stableString(rdata)) return null;
      return GH.put(c, merged, remote.sha).catch(function (e) {
        if ((e.status === 409 || e.status === 422) && ++attempt < 3) return once();
        throw e;
      });
    });
  }
  return once().then(function () {
    SYNC.state = 'ok'; SYNC.last = new Date(); SYNC.msg = '';
  }).catch(function (e) {
    SYNC.state = 'error';
    SYNC.msg = e && e.status ? e.message : '오프라인이거나 GitHub에 연결할 수 없어요';
  }).then(function () {
    SYNC.running = false; updateSyncChip();
    if (SYNC.pending) { SYNC.pending = false; syncNow(); }
  });
}

/* ===== 날씨 ===== */
function loadWeather(force) {
  var s = DATA.settings || {};
  var lat = +s.lat, lon = +s.lon;
  if (!isFinite(lat) || !isFinite(lon)) return;
  if (!force && WEATHER && WEATHER.lat === lat && WEATHER.lon === lon && Date.now() - WEATHER.fetchedAt < 3 * 3600 * 1000) return;
  if (WX.loading) return;
  WX.loading = true; WX.error = null; requestRender();
  fetchWeather(lat, lon, WEATHER).then(function (w) {
    WEATHER = w; Store.set(LS.wx, w);
  }).catch(function (e) {
    WX.error = (e && e.message) || '불러오지 못했어요';
  }).then(function () { WX.loading = false; requestRender(); });
}

/* ===== 시작 ===== */
function init() {
  var saved = Store.get(LS.data);
  DATA = saved ? normalizeData(saved) : seedData(todayStr());
  if (!saved) Store.set(LS.data, DATA);
  WEATHER = Store.get(LS.wx);
  UI = Store.get(LS.ui) || { bannerOff: false, infoTab: {} };
  var r0 = parseRoute();
  if (r0.overlay) lastBase = '#/';
  else lastBase = location.hash || '#/';
  render();
  loadWeather(false);
  syncNow();

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.getAttribute('data-act') === 'ov-bg') { if (e.target === el) closeOverlay(); return; }
    onAct(el.getAttribute('data-act'), el);
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-task]')) {
      var key = t.getAttribute('data-task'), done = t.checked, today = todayStr();
      return commit(function (d) { d.tasks[today + '|' + key] = { done: done, updatedAt: Date.now() }; });
    }
    if (t.matches('[data-chk]')) { CHECK.checks[t.getAttribute('data-chk')] = t.checked; return; }
    if (t.id === 'read-date') {
      READ_DATE = t.value || null;
      delete DIRTY['r-temp']; delete DIRTY['r-hum']; delete DIRTY['r-tmin'];
      t.blur(); return render();
    }
    if (t.id === 'import-file' && t.files && t.files[0]) { importFile(t.files[0]); t.value = ''; return; }
    if (t.id && t.closest('form')) DIRTY[t.id] = true;
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'check-note' && CHECK) { CHECK.note = e.target.value; return; }
    if (e.target.id && e.target.closest('form')) DIRTY[e.target.id] = true;
  });
  document.addEventListener('submit', function (e) { e.preventDefault(); onSubmit(e.target); DIRTY = {}; });
  document.addEventListener('pointerdown', function () { POINTER_DOWN = true; }, true);
  document.addEventListener('pointerup', function () { setTimeout(function () { POINTER_DOWN = false; }, 0); }, true);
  document.addEventListener('pointercancel', function () { POINTER_DOWN = false; }, true);
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (NEED_RENDER && !isEditing() && !POINTER_DOWN && !/^(edit|spot|info)$/.test(parseRoute().overlay || '')) render(); }, 350);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && parseRoute().overlay) closeOverlay();
  });
  window.addEventListener('hashchange', function () {
    var r = parseRoute();
    if (r.overlay) { if (!overlayPushed) overlayPushed = true; }
    else {
      overlayPushed = false;
      var nb = location.hash || '#/';
      if (nb !== lastBase) { DIRTY = {}; window.scrollTo(0, 0); }
      lastBase = nb; CHECK = null;
    }
    render();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { loadWeather(false); syncNow(); requestRender(); }
  });
  setInterval(function () { requestRender(); }, 5 * 60 * 1000);
}
if (typeof window !== 'undefined' && !window.__PLANTCARE_TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}

</script>
