<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF9">
<title>리마인더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23C2410C'/%3E%3Cpath d='m7 12 3.5 3.5L17 9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FAFAF9;
    --ink: #1C1917;
    --ink2: #44403C;
    --muted: #57534E;
    --subtle: #78716C;
    --line: #E7E5E4;
    --line2: #D6D3D1;
    --chip: #EFEDEA;
    --accent: #C2410C;
    --soft: #FDF1E8;
  }
  body[data-mode="work"] { --accent: #1D4ED8; --soft: #EEF3FE; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: anywhere;
    min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 32px 64px; display: flex; flex-direction: column; gap: 28px; }

  /* 상단 */
  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .titlebox { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .date { margin: 0; font-size: 15px; color: var(--muted); }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--chip); border-radius: 999px; }
  .seg button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 16px; font-weight: 700; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--accent); box-shadow: 0 1px 3px rgba(28,25,23,0.18); }
  .seg.neutral button[aria-pressed="true"] { color: var(--ink); }
  .tools { display: flex; gap: 8px; }
  .btn-ghost { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; color: var(--ink2); font-size: 15px; font-weight: 500; }
  .btn-ghost:hover { border-color: var(--line2); }
  .btn-square { width: 44px; padding: 0; }

  /* 공통 */
  h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-head.center { align-items: center; }
  .card-head.baseline { align-items: baseline; }
  .title-line { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .sub { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .count { margin: 0; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .empty { margin: 0; padding: 8px; font-size: 15px; color: var(--muted); }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 auto; border: 0; border-radius: 10px; background: transparent; color: var(--subtle); }
  .icon-btn:hover { background: rgba(28,25,23,0.06); color: var(--ink); }
  .btn-soft { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #FFFFFF; color: var(--accent); font-size: 15px; font-weight: 700; flex: 0 0 auto; }
  .btn-primary { height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 700; flex: 0 0 auto; }
  .btn-primary:hover { filter: brightness(0.94); }
  .btn-line { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 12px; background: #FFFFFF; color: var(--ink2); font-size: 15px; font-weight: 500; flex: 0 0 auto; }
  .btn-line:hover { background: #F5F5F4; }
  .btn-text { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--accent); font-size: 15px; font-weight: 700; }
  .btn-text:hover { background: var(--soft); }
  .text-input { flex: 1 1 auto; min-width: 0; height: 48px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 12px; background: #FAFAF9; font-size: 16px; }
  .text-input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; background: #FFFFFF; }
  .edit-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .edit-row .btn-line { height: 48px; }

  /* 명심할 것 */
  .motto { background: var(--soft); border-radius: 24px; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 20px; }
  .motto h2 { font-size: 17px; color: var(--accent); }
  .motto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .motto-card { display: flex; align-items: center; gap: 4px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 14px 8px 14px 24px; box-shadow: 0 1px 2px rgba(28,25,23,0.06); }
  .motto-text { margin: 0; flex: 1 1 auto; min-width: 0; font-size: 22px; font-weight: 700; line-height: 1.4; }
  .motto-edit { grid-column: 1 / -1; background: #FFFFFF; border-radius: 16px; padding: 10px; }
  .motto .empty { grid-column: 1 / -1; }

  /* 할 일 · 체크리스트 */
  .cols { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .card { flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 2px; border-radius: 12px; }
  .row:hover { background: #FAFAF9; }
  .row.editing { padding: 4px 0; }
  .row.editing:hover { background: transparent; }
  .check { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 4px 8px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 0; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
  .check span { font-size: 18px; line-height: 1.4; min-width: 0; }
  .check.done span { color: var(--subtle); text-decoration: line-through; }
  .done-block { border-top: 1px dashed var(--line2); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .done-label { margin: 0 0 4px 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .add-row { display: flex; gap: 8px; }
  .big-count { margin: 0; font-size: 22px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .progress { height: 8px; background: #F0EFED; border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.2s ease; }
  .card-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

  /* 기록 */
  .day { display: flex; flex-direction: column; gap: 8px; }
  .day h3 { margin: 0; font-size: 14px; font-weight: 500; color: var(--muted); }
  .hist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .hist-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 12px; border-radius: 12px; background: #FAFAF9; }
  .hist-item.col { flex-direction: column; align-items: stretch; gap: 4px; }
  .hist-line { display: flex; align-items: center; gap: 12px; }
  .hist-text { flex: 1 1 auto; min-width: 0; font-size: 17px; }
  .hist-check { color: #15803D; flex: 0 0 auto; display: flex; }
  .hist-count { flex: 0 0 auto; min-width: 48px; text-align: right; font-size: 17px; font-weight: 700; }
  .hist-count.ok { color: #15803D; }
  .hist-count.miss { color: #9A3412; }
  .missed { margin: 0; font-size: 14px; color: #9A3412; }
  .chip { flex: 0 0 auto; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .chip.home { background: #FDF1E8; color: #9A3412; }
  .chip.work { background: #EEF3FE; color: #1E40AF; }

  /* 경고 · 알림 */
  .warn { margin: 0; padding: 14px 18px; border-radius: 14px; background: #FEF2F2; color: #991B1B; font-size: 15px; line-height: 1.5; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px); padding: 12px 20px; border-radius: 999px; background: #1C1917; color: #FFFFFF; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 백업 창 */
  .overlay { position: fixed; inset: 0; background: rgba(28,25,23,0.4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .dialog { width: 100%; max-width: 480px; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 24px rgba(28,25,23,0.18); }
  .dialog-text { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ink2); }
  .big-btn { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 18px; border: 1px solid var(--line2); border-radius: 14px; background: #FFFFFF; color: var(--ink); text-align: left; }
  .big-btn:hover { background: #F5F5F4; }
  .big-btn.dark { border-color: #1C1917; background: #1C1917; color: #FFFFFF; }
  .big-btn.dark:hover { background: #292524; }
  .big-btn-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .big-btn-text .t { font-size: 16px; font-weight: 700; }
  .big-btn-text .s { font-size: 13px; color: var(--muted); }
  .big-btn.dark .big-btn-text .s { color: #D6D3D1; }
  .dialog-foot { margin: 0; font-size: 13px; color: var(--muted); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* 휴대폰 */
  @media (max-width: 640px) {
    .wrap { padding: 20px 16px 32px; gap: 16px; }
    header.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
    .titlebox { order: 1; gap: 2px; }
    .tools { order: 2; gap: 6px; }
    header.top .seg { order: 3; grid-column: 1 / -1; }
    .seg button { flex: 1 1 0; padding: 0 12px; }
    h1 { font-size: 22px; }
    .date { font-size: 14px; }
    .tools .lbl { display: none; }
    .tools .btn-ghost { width: 44px; padding: 0; }
    .motto { padding: 18px 16px 16px; border-radius: 20px; gap: 12px; }
    .motto h2 { font-size: 16px; }
    .motto-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .motto-card { padding: 8px 4px 8px 18px; border-radius: 14px; }
    .motto-text { font-size: 19px; }
    .cols { gap: 16px; }
    .card { flex-basis: 100%; padding: 18px 16px; border-radius: 20px; gap: 10px; }
    h2 { font-size: 18px; }
    .check { gap: 12px; padding: 4px 4px; }
    .check span { font-size: 17px; }
    .big-count { font-size: 20px; }
    .btn-primary { padding: 0 16px; }
    .edit-row .btn-line { padding: 0 12px; }
  }
</style>
</head>
<body data-mode="home">
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">

<script>
(function () {
  'use strict';

  var KEY = 'newtab-reminder-v1';
  var MODES = ['home', 'work'];
  var MODE_INFO = {
    home: { label: '집안용', chip: '집안', heading: '집에서 잊지 말 것', checklistTitle: '자기 전 확인' },
    work: { label: '회사용', chip: '회사', heading: '회사에서 잊지 말 것', checklistTitle: '퇴근 전 확인' }
  };

  /* ---------- 아이콘 ---------- */
  var P = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
    work: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    upload: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    pencil: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/>',
    trash: '<path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
    refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
    back: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    close: '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
    check: '<path d="m5 12 5 5 9-10"/>'
  };
  function svg(paths, size, sw) {
    size = size || 18; sw = sw || 2;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + sw +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + paths + '</svg>';
  }

  /* ---------- 도우미 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dateKey(new Date()); }
  function isDateKey(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function keyToDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtDay(k) { return keyToDate(k).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }); }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return typeof x === 'string' ? x : ''; }
  function hasText(x) { return x && typeof x.text === 'string' && x.text.trim() !== ''; }

  /* ---------- 데이터 ---------- */
  function defaultState() {
    return {
      app: 'newtab-reminder',
      version: 1,
      mode: 'home',
      modes: {
        home: { mottos: [], todos: [], checklistTitle: MODE_INFO.home.checklistTitle, checklist: [] },
        work: {
          mottos: [{ id: uid(), text: '언제나 의심하자' }, { id: uid(), text: '왜인지 생각하자' }],
          todos: [], checklistTitle: MODE_INFO.work.checklistTitle, checklist: []
        }
      },
      checkLog: {},
      lastExport: null
    };
  }

  // 저장된 데이터나 가져온 파일을 안전한 모양으로 정리한다. 모양이 맞지 않으면 null.
  function normalize(raw) {
    if (!raw || typeof raw !== 'object' || !raw.modes || typeof raw.modes !== 'object') return null;
    var out = {
      app: 'newtab-reminder',
      version: 1,
      mode: raw.mode === 'work' ? 'work' : 'home',
      modes: {},
      checkLog: {},
      lastExport: typeof raw.lastExport === 'string' ? raw.lastExport : null
    };
    MODES.forEach(function (m) {
      var src = raw.modes[m] && typeof raw.modes[m] === 'object' ? raw.modes[m] : {};
      out.modes[m] = {
        mottos: arr(src.mottos).filter(hasText).map(function (x) { return { id: str(x.id) || uid(), text: x.text }; }),
        todos: arr(src.todos).filter(hasText).map(function (x) {
          var doneAt = str(x.doneAt) || null;
          var doneDate = isDateKey(x.doneDate) ? x.doneDate : null;
          if (!doneAt || !doneDate) { doneAt = null; doneDate = null; }
          return { id: str(x.id) || uid(), text: x.text, createdAt: str(x.createdAt) || null, doneAt: doneAt, doneDate: doneDate };
        }),
        checklistTitle: str(src.checklistTitle).trim() ? src.checklistTitle : MODE_INFO[m].checklistTitle,
        checklist: arr(src.checklist).filter(hasText).map(function (x) { return { id: str(x.id) || uid(), text: x.text }; })
      };
    });
    if (raw.checkLog && typeof raw.checkLog === 'object') {
      Object.keys(raw.checkLog).forEach(function (k) {
        var day = raw.checkLog[k];
        if (!isDateKey(k) || !day || typeof day !== 'object') return;
        var d = {};
        MODES.forEach(function (m) {
          var r = day[m];
          if (!r || typeof r !== 'object') return;
          var rec = {
            title: str(r.title) || out.modes[m].checklistTitle,
            items: arr(r.items).filter(hasText).map(function (i) { return { id: str(i.id) || uid(), text: i.text }; }),
            checked: {}
          };
          if (r.checked && typeof r.checked === 'object') {
            Object.keys(r.checked).forEach(function (id) { if (r.checked[id]) rec.checked[id] = true; });
          }
          d[m] = rec;
        });
        if (Object.keys(d).length) out.checkLog[k] = d;
      });
    }
    return out;
  }

  var storageOk = true;

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; return defaultState(); }
    if (!raw) return defaultState();
    try {
      var data = normalize(JSON.parse(raw));
      if (data) return data;
    } catch (e) { /* 아래에서 처리 */ }
    // 읽을 수 없는 데이터는 지우지 않고 따로 남겨 둔다.
    var fresh = defaultState();
    try {
      localStorage.setItem(KEY + '-broken-' + Date.now(), raw);
      localStorage.setItem(KEY, JSON.stringify(fresh));
    } catch (e) { /* 무시 */ }
    return fresh;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) { storageOk = false; }
  }

  function checkStorage() {
    try { localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test'); storageOk = true; }
    catch (e) { storageOk = false; }
  }

  var state = load();
  var ui = { view: 'main', filter: 'all', editing: null, modal: false, renderedDay: null, focusAfter: null };

  /* ---------- 오늘의 체크리스트 기록 ---------- */
  function syncRec(rec, mode) {
    var data = state.modes[mode];
    rec.title = data.checklistTitle;
    rec.items = data.checklist.map(function (i) { return { id: i.id, text: i.text }; });
    var ids = {};
    rec.items.forEach(function (i) { ids[i.id] = true; });
    Object.keys(rec.checked).forEach(function (id) { if (!ids[id]) delete rec.checked[id]; });
  }
  function todayRec(mode, create) {
    var k = todayKey();
    var day = state.checkLog[k];
    if (!day) {
      if (!create) return null;
      day = state.checkLog[k] = {};
    }
    if (!day[mode] && create) {
      day[mode] = { title: '', items: [], checked: {} };
      syncRec(day[mode], mode);
    }
    return day[mode] || null;
  }
  function syncToday(mode) {
    var rec = todayRec(mode, false);
    if (rec) syncRec(rec, mode);
  }

  /* ---------- 화면 조각 ---------- */
  function isEd(kind, id) { return !!ui.editing && ui.editing.kind === kind && ui.editing.id === id; }

  function editForm(kind, id, value, label) {
    return '<form class="edit-row" data-form="edit" data-kind="' + kind + '" data-id="' + esc(id) + '" autocomplete="off">' +
      '<input class="text-input" name="text" type="text" value="' + esc(value) + '" aria-label="' + esc(label) + '" maxlength="200" data-autofocus>' +
      '<button type="submit" class="btn-primary">저장</button>' +
      '<button type="button" class="btn-line" data-act="cancel">취소</button>' +
      '</form>';
  }

  function itemButtons(kind, item) {
    return '<button type="button" class="icon-btn" data-act="edit" data-kind="' + kind + '" data-id="' + esc(item.id) + '" aria-label="' + esc(item.text) + ' 수정">' + svg(P.pencil) + '</button>' +
      '<button type="button" class="icon-btn" data-act="del" data-kind="' + kind + '" data-id="' + esc(item.id) + '" aria-label="' + esc(item.text) + ' 삭제">' + svg(P.trash) + '</button>';
  }

  function warning() {
    if (storageOk) return '';
    return '<p class="warn" role="alert">이 브라우저에서는 내용이 저장되지 않고 있어요. 브라우저 설정에서 이 사이트의 데이터 저장(쿠키·사이트 데이터)을 허용해 주세요.</p>';
  }

  function modeSwitch(mode) {
    return '<div class="seg" role="group" aria-label="모드 전환">' +
      MODES.map(function (m) {
        return '<button type="button" data-act="mode" data-mode="' + m + '" aria-pressed="' + (m === mode) + '">' +
          svg(P[m], 20) + MODE_INFO[m].label + '</button>';
      }).join('') + '</div>';
  }

  function mottoItem(item) {
    if (isEd('motto', item.id)) return '<div class="motto-edit">' + editForm('motto', item.id, item.text, '명심할 것 수정') + '</div>';
    return '<div class="motto-card"><p class="motto-text">' + esc(item.text) + '</p>' + itemButtons('motto', item) + '</div>';
  }

  function todoItem(t) {
    if (isEd('todo', t.id)) return '<li class="row editing">' + editForm('todo', t.id, t.text, '할 일 수정') + '</li>';
    return '<li class="row"><label class="check"><input type="checkbox" data-toggle="todo" data-id="' + esc(t.id) + '"><span>' + esc(t.text) + '</span></label>' +
      itemButtons('todo', t) + '</li>';
  }

  function todoDoneItem(t) {
    return '<li class="row"><label class="check done"><input type="checkbox" data-toggle="todo" data-id="' + esc(t.id) + '" checked><span>' + esc(t.text) + '</span></label></li>';
  }

  function checkItem(i, checked) {
    if (isEd('check', i.id)) return '<li class="row editing">' + editForm('check', i.id, i.text, '항목 수정') + '</li>';
    var on = !!checked[i.id];
    return '<li class="row"><label class="check' + (on ? ' done' : '') + '"><input type="checkbox" data-toggle="check" data-id="' + esc(i.id) + '"' + (on ? ' checked' : '') + '><span>' + esc(i.text) + '</span></label>' +
      itemButtons('check', i) + '</li>';
  }

  function chip(m) { return '<span class="chip ' + m + '">' + MODE_INFO[m].chip + '</span>'; }

  /* ---------- 메인 화면 ---------- */
  function renderMain() {
    var mode = state.mode;
    var data = state.modes[mode];
    var today = todayKey();

    var open = data.todos.filter(function (t) { return !t.doneAt; });
    var doneToday = data.todos.filter(function (t) { return t.doneAt && t.doneDate === today; })
      .sort(function (a, b) { return a.doneAt < b.doneAt ? 1 : -1; });

    var rec = todayRec(mode, false);
    var checked = rec ? rec.checked : {};
    var total = data.checklist.length;
    var got = data.checklist.filter(function (i) { return checked[i.id]; }).length;
    var pct = total ? Math.round(got / total * 100) : 0;

    var h = '';
    h += warning();

    h += '<header class="top">' +
      '<div class="titlebox"><p class="date">' + esc(fmtDay(today)) + '</p><h1>' + esc(MODE_INFO[mode].heading) + '</h1></div>' +
      modeSwitch(mode) +
      '<div class="tools">' +
        '<button type="button" class="btn-ghost" data-act="view" data-view="history" aria-label="기록">' + svg(P.clock) + '<span class="lbl">기록</span></button>' +
        '<button type="button" class="btn-ghost" data-act="open-backup" aria-label="백업">' + svg(P.download) + '<span class="lbl">백업</span></button>' +
      '</div>' +
      '</header>';

    // 명심할 것
    var addingMotto = isEd('motto', 'new');
    h += '<section class="motto" aria-labelledby="motto-h">' +
      '<div class="card-head center"><h2 id="motto-h">명심할 것</h2>' +
      '<button type="button" class="btn-soft" data-act="add" data-kind="motto">' + svg(P.plus, 18, 2.2) + '추가</button></div>' +
      '<div class="motto-grid">' +
        data.mottos.map(mottoItem).join('') +
        (addingMotto ? '<div class="motto-edit">' + editForm('motto', 'new', '', '새로 명심할 것') + '</div>' : '') +
        (!data.mottos.length && !addingMotto ? '<p class="empty">아직 없어요. 오른쪽 위 \'추가\'를 눌러 적어 보세요.</p>' : '') +
      '</div></section>';

    h += '<div class="cols">';

    // 할 일
    h += '<section class="card" aria-labelledby="todo-h">' +
      '<div class="card-head baseline"><h2 id="todo-h">할 일</h2><p class="count">남은 일 ' + open.length + '개</p></div>';
    if (open.length) h += '<ul class="list">' + open.map(todoItem).join('') + '</ul>';
    else if (!doneToday.length) h += '<p class="empty">할 일이 없어요.</p>';
    if (doneToday.length) {
      h += '<div class="done-block"><p class="done-label">오늘 완료 · 기록에 남아요</p><ul class="list">' +
        doneToday.map(todoDoneItem).join('') + '</ul></div>';
    }
    h += '<form class="add-row" data-form="add-todo" autocomplete="off">' +
      '<input class="text-input" name="text" type="text" placeholder="할 일 추가" aria-label="할 일 추가" maxlength="200">' +
      '<button type="submit" class="btn-primary">추가</button></form>' +
      '</section>';

    // 체크리스트
    var titleHtml = isEd('checkTitle', 'title')
      ? editForm('checkTitle', 'title', data.checklistTitle, '체크리스트 이름')
      : '<div class="title-line"><h2 id="check-h">' + esc(data.checklistTitle) + '</h2>' +
        '<button type="button" class="icon-btn" data-act="edit" data-kind="checkTitle" data-id="title" aria-label="체크리스트 이름 수정">' + svg(P.pencil, 16) + '</button></div>';
    var addingCheck = isEd('check', 'new');

    h += '<section class="card" aria-label="' + esc(data.checklistTitle) + '">' +
      '<div class="card-head"><div style="min-width:0;flex:1 1 auto">' + titleHtml + '<p class="sub">매일 자정에 새로 시작해요</p></div>' +
      '<p class="big-count" aria-label="' + total + '개 중 ' + got + '개 확인">' + got + ' / ' + total + '</p></div>' +
      '<div class="progress" aria-hidden="true"><div style="width:' + pct + '%"></div></div>';
    if (total || addingCheck) {
      h += '<ul class="list">' + data.checklist.map(function (i) { return checkItem(i, checked); }).join('') +
        (addingCheck ? '<li class="row editing">' + editForm('check', 'new', '', '새 항목') + '</li>' : '') + '</ul>';
    } else {
      h += '<p class="empty">항목이 없어요. \'항목 추가\'로 만들어 보세요.</p>';
    }
    h += '<div class="card-foot">' +
      '<button type="button" class="btn-line" data-act="reset-today">' + svg(P.refresh) + '오늘 초기화</button>' +
      '<button type="button" class="btn-text" data-act="add" data-kind="check">' + svg(P.plus, 18, 2.2) + '항목 추가</button>' +
      '</div></section>';

    h += '</div>';
    return h;
  }

  /* ---------- 기록 화면 ---------- */
  function renderHistory() {
    var shown = ui.filter === 'all' ? MODES : [ui.filter];
    var today = todayKey();

    var groups = {};
    shown.forEach(function (m) {
      state.modes[m].todos.forEach(function (t) {
        if (!t.doneAt || !t.doneDate) return;
        (groups[t.doneDate] = groups[t.doneDate] || []).push({ text: t.text, doneAt: t.doneAt, mode: m });
      });
    });
    var doneDays = Object.keys(groups).sort().reverse();

    var logDays = Object.keys(state.checkLog).filter(function (k) {
      return shown.some(function (m) { return state.checkLog[k][m]; });
    }).sort().reverse();

    function dayTitle(k) { return (k === today ? '오늘 · ' : '') + fmtDay(k); }

    var h = '';
    h += warning();
    h += '<header class="top">' +
      '<div class="title-line" style="gap:12px">' +
        '<button type="button" class="btn-ghost btn-square" data-act="view" data-view="main" aria-label="돌아가기">' + svg(P.back, 20) + '</button>' +
        '<h1>기록</h1></div>' +
      '<div class="seg neutral" role="group" aria-label="보기 범위">' +
        [['all', '전체'], ['home', '집안용'], ['work', '회사용']].map(function (f) {
          return '<button type="button" data-act="filter" data-filter="' + f[0] + '" aria-pressed="' + (ui.filter === f[0]) + '">' + f[1] + '</button>';
        }).join('') +
      '</div></header>';

    h += '<div class="cols">';

    h += '<section class="card" aria-labelledby="done-h" style="gap:20px"><h2 id="done-h">완료한 할 일</h2>';
    if (!doneDays.length) h += '<p class="empty">아직 완료한 할 일이 없어요.</p>';
    doneDays.forEach(function (k) {
      var items = groups[k].sort(function (a, b) { return a.doneAt < b.doneAt ? 1 : -1; });
      h += '<div class="day"><h3>' + esc(dayTitle(k)) + '</h3><ul class="hist-list">' +
        items.map(function (t) {
          return '<li class="hist-item"><span class="hist-check">' + svg(P.check, 18, 2.4) + '</span><span class="hist-text">' + esc(t.text) + '</span>' + chip(t.mode) + '</li>';
        }).join('') + '</ul></div>';
    });
    h += '</section>';

    h += '<section class="card" aria-labelledby="log-h" style="gap:20px"><h2 id="log-h">체크리스트 기록</h2>';
    if (!logDays.length) h += '<p class="empty">아직 체크리스트 기록이 없어요.</p>';
    logDays.forEach(function (k) {
      var day = state.checkLog[k];
      h += '<div class="day"><h3>' + esc(dayTitle(k)) + '</h3><ul class="hist-list">' +
        shown.filter(function (m) { return day[m]; }).map(function (m) {
          var r = day[m];
          var total = r.items.length;
          var got = r.items.filter(function (i) { return r.checked[i.id]; }).length;
          var missed = r.items.filter(function (i) { return !r.checked[i.id]; }).map(function (i) { return i.text; });
          var full = total > 0 && got === total;
          return '<li class="hist-item col"><div class="hist-line"><span class="hist-text">' + esc(r.title) + '</span>' + chip(m) +
            '<span class="hist-count ' + (full ? 'ok' : 'miss') + '">' + got + ' / ' + total + '</span></div>' +
            (missed.length ? '<p class="missed">' + (k === today ? '남은 항목: ' : '빠진 항목: ') + esc(missed.join(', ')) + '</p>' : '') +
            '</li>';
        }).join('') + '</ul></div>';
    });
    h += '</section>';

    h += '</div>';
    return h;
  }

  /* ---------- 백업 창 ---------- */
  var modalRoot = document.getElementById('modal');
  var wasModalOpen = false;

  function renderModal() {
    if (!ui.modal) {
      modalRoot.innerHTML = '';
      document.body.style.overflow = '';
      wasModalOpen = false;
      return;
    }
    var last = state.lastExport
      ? new Date(state.lastExport).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : null;
    modalRoot.innerHTML =
      '<div class="overlay" data-overlay>' +
      '<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="bk-h">' +
        '<div class="card-head center"><h2 id="bk-h">백업</h2>' +
        '<button type="button" class="icon-btn" data-act="close-backup" aria-label="닫기">' + svg(P.close, 20) + '</button></div>' +
        '<p class="dialog-text">적어둔 내용은 이 기기의 브라우저 안에만 저장돼요. 다른 기기와 맞추려면 파일로 내보낸 뒤, 그 기기에서 가져오세요.</p>' +
        '<button type="button" class="big-btn dark" data-act="export">' + svg(P.download, 22) +
          '<span class="big-btn-text"><span class="t">내보내기 · 파일로 저장</span><span class="s">reminder-backup-' + todayKey() + '.json</span></span></button>' +
        '<button type="button" class="big-btn" data-act="import">' + svg(P.upload, 22) +
          '<span class="big-btn-text"><span class="t">가져오기 · 파일 선택</span><span class="s">이 기기의 내용이 파일 내용으로 바뀌어요</span></span></button>' +
        '<p class="dialog-foot">' + (last ? '마지막 내보내기: ' + esc(last) : '아직 내보낸 적이 없어요') + '</p>' +
      '</section></div>';
    document.body.style.overflow = 'hidden';
    if (!wasModalOpen) {
      var first = modalRoot.querySelector('[data-act="export"]');
      if (first) first.focus();
    }
    wasModalOpen = true;
  }

  /* ---------- 그리기 ---------- */
  var app = document.getElementById('app');

  function render() {
    ui.renderedDay = todayKey();
    document.body.setAttribute('data-mode', state.mode);
    app.innerHTML = ui.view === 'history' ? renderHistory() : renderMain();
    renderModal();
    document.title = ui.view === 'history' ? '기록 · 리마인더' : MODE_INFO[state.mode].label + ' · 리마인더';
    if (!ui.modal) {
      var af = app.querySelector('[data-autofocus]');
      if (af) {
        af.focus();
        var n = af.value.length;
        try { af.setSelectionRange(n, n); } catch (e) { /* 무시 */ }
      }
    }
    if (ui.focusAfter) {
      var el = document.querySelector(ui.focusAfter);
      if (el) el.focus();
      ui.focusAfter = null;
    }
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2500);
  }

  /* ---------- 동작 ---------- */
  function commit() { save(); render(); }

  function listOf(kind, mode) {
    var d = state.modes[mode];
    if (kind === 'motto') return d.mottos;
    if (kind === 'todo') return d.todos;
    if (kind === 'check') return d.checklist;
    return null;
  }

  function setMode(m) {
    if (!MODE_INFO[m] || m === state.mode) return;
    state.mode = m;
    ui.editing = null;
    commit();
  }

  function saveEdit(kind, id, text) {
    var mode = state.mode;
    var data = state.modes[mode];
    if (!text) { ui.editing = null; render(); return; }
    if (kind === 'checkTitle') {
      data.checklistTitle = text;
      syncToday(mode);
      ui.editing = null;
    } else {
      var list = listOf(kind, mode);
      if (!list) return;
      if (id === 'new') {
        var item = { id: uid(), text: text };
        if (kind === 'todo') { item.createdAt = new Date().toISOString(); item.doneAt = null; item.doneDate = null; }
        list.push(item);
        ui.editing = { kind: kind, id: 'new' }; // 이어서 하나 더 적을 수 있게 입력칸을 열어 둔다
      } else {
        var it = list.filter(function (x) { return x.id === id; })[0];
        if (it) it.text = text;
        ui.editing = null;
      }
      if (kind === 'check') syncToday(mode);
    }
    commit();
  }

  function removeItem(kind, id) {
    var mode = state.mode;
    var list = listOf(kind, mode);
    if (!list) return;
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    if (!window.confirm('"' + list[idx].text + '"\n이 항목을 지울까요?')) return;
    list.splice(idx, 1);
    if (kind === 'check') syncToday(mode);
    if (ui.editing && ui.editing.id === id) ui.editing = null;
    commit();
  }

  function addTodo(text) {
    state.modes[state.mode].todos.push({ id: uid(), text: text, createdAt: new Date().toISOString(), doneAt: null, doneDate: null });
    ui.focusAfter = 'form[data-form="add-todo"] input';
    commit();
  }

  function toggleTodo(id) {
    var t = state.modes[state.mode].todos.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    if (t.doneAt) { t.doneAt = null; t.doneDate = null; }
    else { t.doneAt = new Date().toISOString(); t.doneDate = todayKey(); }
    commit();
  }

  function toggleCheck(id) {
    var mode = state.mode;
    var rec = todayRec(mode, true);
    syncRec(rec, mode);
    if (rec.checked[id]) delete rec.checked[id];
    else rec.checked[id] = true;
    commit();
  }

  function resetToday() {
    var mode = state.mode;
    var k = todayKey();
    var day = state.checkLog[k];
    if (!day || !day[mode] || !Object.keys(day[mode].checked).length) {
      toast('오늘은 아직 체크한 항목이 없어요');
      return;
    }
    if (!window.confirm('오늘 체크한 것만 지울까요?\n지난 날짜의 기록은 그대로 남아요.')) return;
    delete day[mode];
    if (!Object.keys(day).length) delete state.checkLog[k];
    commit();
    toast('오늘 체크를 초기화했어요');
  }

  function closeModal() {
    ui.modal = false;
    render();
    var btn = app.querySelector('[data-act="open-backup"]');
    if (btn) btn.focus();
  }

  function exportData() {
    state.lastExport = new Date().toISOString();
    save();
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'reminder-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    render();
    toast('백업 파일을 저장했어요');
  }

  var fileInput = document.getElementById('file');
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var raw = null;
      try { raw = JSON.parse(String(reader.result)); } catch (e) { raw = null; }
      var data = raw && raw.app === 'newtab-reminder' ? normalize(raw) : null;
      if (!data) { window.alert('이 리마인더의 백업 파일이 아니에요.'); return; }
      if (!window.confirm('이 기기의 내용이 파일 내용으로 바뀌어요.\n계속할까요?')) return;
      data.lastExport = state.lastExport;
      state = data;
      ui.editing = null;
      ui.modal = false;
      commit();
      toast('가져오기를 마쳤어요');
    };
    reader.onerror = function () { window.alert('파일을 읽지 못했어요.'); };
    reader.readAsText(f);
  });

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var overlay = e.target.closest ? e.target.closest('[data-overlay]') : null;
    if (overlay && e.target === overlay) { closeModal(); return; }
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var kind = el.getAttribute('data-kind');
    var id = el.getAttribute('data-id');
    switch (act) {
      case 'mode': setMode(el.getAttribute('data-mode')); break;
      case 'view':
        ui.view = el.getAttribute('data-view');
        ui.editing = null;
        render();
        window.scrollTo(0, 0);
        break;
      case 'filter': ui.filter = el.getAttribute('data-filter'); render(); break;
      case 'add': ui.editing = { kind: kind, id: 'new' }; render(); break;
      case 'edit': ui.editing = { kind: kind, id: id }; render(); break;
      case 'cancel': ui.editing = null; render(); break;
      case 'del': removeItem(kind, id); break;
      case 'reset-today': resetToday(); break;
      case 'open-backup': ui.modal = true; ui.editing = null; render(); break;
      case 'close-backup': closeModal(); break;
      case 'export': exportData(); break;
      case 'import': fileInput.click(); break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.matches || !t.matches('input[data-toggle]')) return;
    if (t.getAttribute('data-toggle') === 'todo') toggleTodo(t.getAttribute('data-id'));
    else toggleCheck(t.getAttribute('data-id'));
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f.matches || !f.matches('form[data-form]')) return;
    e.preventDefault();
    var text = (f.elements.text.value || '').trim();
    if (f.getAttribute('data-form') === 'add-todo') {
      if (text) addTodo(text);
      return;
    }
    saveEdit(f.getAttribute('data-kind'), f.getAttribute('data-id'), text);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.isComposing) return;
    if (ui.modal) { closeModal(); return; }
    if (ui.editing) { ui.editing = null; render(); }
  });

  // 다른 탭에서 바꾼 내용을 반영한다.
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    state = load();
    if (!ui.editing) render();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !storageOk) return;
    state = load();
    if (!ui.editing) render();
  });
  // 자정이 지나면 체크리스트를 새 날로 다시 그린다.
  setInterval(function () {
    if (todayKey() !== ui.renderedDay && !ui.editing) render();
  }, 30000);

  /* ---------- 시작 ---------- */
  checkStorage();
  if (storageOk) save();
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () { /* 무시 */ });
  }
  render();
})();
</script>
</body>
</html>
